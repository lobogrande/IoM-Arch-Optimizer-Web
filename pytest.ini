[pytest]
# Pytest configuration for IoM Arch Optimizer

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output and reporting
addopts =
    # Verbose output with test names
    -v
    # Show extra test summary info
    -ra
    # Enable coverage reporting
    --cov=public/core
    --cov=public/engine
    --cov-report=term-missing
    --cov-report=html:coverage_html
    # Fail if coverage drops below threshold (disabled for incremental testing)
    # --cov-fail-under=80
    # Show slowest 10 tests
    --durations=10
    # Strict markers (fail on unknown markers)
    --strict-markers

# Markers for test categorization (matches JavaScript test tags)
markers =
    unit: Unit tests for isolated functions
    integration: Tests that combine multiple modules
    slow: Tests that take >1 second to run
    critical: High-priority tests that must always pass
    validation: Tests for input validation and edge cases
    formulas: Tests for game formula accuracy

# Coverage configuration
[coverage:run]
branch = True
source = public/core,public/engine
omit =
    */tests/*
    */test_*.py
    */__pycache__/*

[coverage:report]
precision = 2
skip_empty = True
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
