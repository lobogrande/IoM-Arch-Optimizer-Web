[package]
name = "engine_wasm"
version = "0.1.0"
edition = "2021"

[lib]
# cdylib produces a .wasm with raw extern "C" exports — no wasm-bindgen runtime.
crate-type = ["cdylib"]

[profile.release]
# Optimize for size + speed; LTO buys the most from this kind of pure-numeric code.
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
# Dev builds are still WASM-compiled; we don't run unit tests here (those use the
# host target via `cargo test`). Faster compile, no debug info.
panic = "abort"
