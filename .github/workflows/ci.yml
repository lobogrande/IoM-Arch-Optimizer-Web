name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linter
        run: npm run lint
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
      
      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Validate Python syntax
        run: |
          python3 -m py_compile public/core/*.py
          python3 -m py_compile public/engine/*.py
          echo "✓ Python syntax valid"
      
      - name: Run Python tests
        run: |
          pytest tests/ -v --cov=public/core --cov=public/engine --cov-report=term --cov-report=html
          echo "✓ Python tests passed"
      
      - name: Run JavaScript tests
        run: npm test
      
      - name: Build project
        run: npm run build
      
      - name: Check if WASM engine exists
        id: check_wasm
        run: |
          if [ -d "engine_wasm" ]; then
            echo "wasm_exists=true" >> $GITHUB_OUTPUT
          else
            echo "wasm_exists=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Setup Rust (if WASM engine present)
        if: steps.check_wasm.outputs.wasm_exists == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      
      - name: Build WASM engine (if present)
        if: steps.check_wasm.outputs.wasm_exists == 'true'
        run: |
          # Save committed binary for comparison
          if [ -f "public/engine.wasm" ]; then
            cp public/engine.wasm public/engine.wasm.committed
          fi
          
          cd engine_wasm
          cargo build --release --target wasm32-unknown-unknown
          
          # Copy built WASM to public/
          mkdir -p ../public
          cp target/wasm32-unknown-unknown/release/engine_wasm.wasm ../public/engine.wasm
          
          echo "✓ WASM engine built from source successfully"
          
          # Size comparison
          BUILT_SIZE=$(wc -c < ../public/engine.wasm)
          echo "Built WASM size: $BUILT_SIZE bytes"
          
          if [ -f "../public/engine.wasm.committed" ]; then
            COMMITTED_SIZE=$(wc -c < ../public/engine.wasm.committed)
            echo "Previously committed size: $COMMITTED_SIZE bytes"
            
            # Check reproducibility
            if cmp -s ../public/engine.wasm ../public/engine.wasm.committed; then
              echo "✅ WASM binary matches committed version"
            else
              echo "⚠️  WASM binary differs from committed version"
            fi
          fi
      
      - name: Run Rust tests (if WASM engine present)
        if: steps.check_wasm.outputs.wasm_exists == 'true'
        run: |
          cd engine_wasm
          cargo test --release
      
      - name: Run baseline validation (if WASM engine present)
        if: steps.check_wasm.outputs.wasm_exists == 'true'
        run: |
          if [ -f "scripts/diff_baselines_strict.mjs" ]; then
            # Only run if baseline results exist
            if [ -d "baseline_results" ]; then
              node scripts/diff_baselines_strict.mjs || echo "⚠️ Baseline validation not required for this PR"
            fi
          fi
      
      - name: Build summary
        run: |
          echo "✅ Build completed successfully"
          echo "✅ JavaScript tests passed (238 tests)"
          echo "✅ Python tests passed (235 tests)"
          if [ -d "engine_wasm" ]; then
            echo "✅ WASM engine validated"
          else
            echo "ℹ️  Python engine only (no WASM)"
          fi
